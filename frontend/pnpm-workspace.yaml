allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@next/env@15.5.28'
  - '@next/swc-darwin-arm64@15.5.28'
  - '@next/swc-darwin-x64@15.5.28'
  - '@next/swc-linux-arm64-gnu@15.5.28'
  - '@next/swc-linux-arm64-musl@15.5.28'
  - '@next/swc-linux-x64-gnu@15.5.28'
  - '@next/swc-linux-x64-musl@15.5.28'
  - '@next/swc-win32-arm64-msvc@15.5.28'
  - '@next/swc-win32-x64-msvc@15.5.28'
  - next@15.5.28

overrides:
  postcss: ^8.5.26
  sharp: ^0.35.5
  brace-expansion: ^5.0.12
  # minimatch@9 does `import expand from 'brace-expansion'` (default export),
  # which v5 dropped — keep it on the patched 2.x line.
  minimatch@9>brace-expansion: ^2.1.7
  minimatch@3>brace-expansion: ^1.1.12
  nanoid: ^6.0.1
  js-yaml: ^5.3.0
  source-map-js: ^1.2.2
  glob@10: ^10.5.0

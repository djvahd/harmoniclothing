[build]
  base = "frontend"
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Proxy API calls through the same origin as the frontend so the Sanctum
# session/CSRF cookies are first-party, not cross-site — modern browsers
# increasingly block third-party cookies outright, which SameSite=None
# alone can't work around. Update the target host here (and in Railway's
# `api` service's Networking settings) if the backend domain ever changes.
#
# TEMPORARY (2026-09-23): Railway's trial expired and the `api` service is
# down; rather than pay for a new host immediately, these 4 redirects point at
# a Cloudflare quick tunnel (`cloudflared tunnel --url http://localhost:8000`)
# into a local dev machine's backend. A quick tunnel's hostname is random and
# changes every time the tunnel process restarts — if the site goes down
# again, check whether the tunnel is still running before assuming a new bug,
# and update the 4 URLs below to match. Revert all 4 back to
# `https://api-production-a4d61.up.railway.app` (or a real replacement host)
# once real hosting is sorted — see DEPLOYMENT.md.
[[redirects]]
  from = "/api/*"
  to = "https://paragraph-glasgow-incident-mass.trycloudflare.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sanctum/*"
  to = "https://paragraph-glasgow-incident-mass.trycloudflare.com/sanctum/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/broadcasting/*"
  to = "https://paragraph-glasgow-incident-mass.trycloudflare.com/broadcasting/:splat"
  status = 200
  force = true

# Publicly-served uploads (design files, product mockup photos) live on the
# backend's public disk under /storage/*. storageUrl() in the frontend builds
# these URLs from NEXT_PUBLIC_API_URL, which is this same Netlify domain (see
# the cookie-proxy comment above) — without this rule every product/design
# image 404s since Netlify has no route for /storage/* on its own.
[[redirects]]
  from = "/storage/*"
  to = "https://paragraph-glasgow-incident-mass.trycloudflare.com/storage/:splat"
  status = 200
  force = true

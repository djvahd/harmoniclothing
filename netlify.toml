[build]
  base = "frontend"
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Proxy API calls through the same origin as the frontend so the Sanctum
# session/CSRF cookies are first-party, not cross-site — modern browsers
# increasingly block third-party cookies outright, which SameSite=None
# alone can't work around. Update the target host here (and in Railway's
# `api` service's Networking settings) if the backend domain ever changes.
#
# TEMPORARY (2026-10-12): Railway's trial expired and the `api` service is
# down; these 4 redirects point at `api.harmoniclothing.com`, a Cloudflare
# *named* tunnel (`harmoni-api`, `cloudflared tunnel run harmoni-api`) into a
# local dev machine's backend on :8000. The hostname is stable, so a restart
# doesn't change it — if the site 502s, check that `php artisan serve` and the
# tunnel are both running on that machine. Repoint `api.` at real hosting (or
# revert these URLs) once it is sorted — see DEPLOYMENT.md.
[[redirects]]
  from = "/api/*"
  to = "https://api.harmoniclothing.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sanctum/*"
  to = "https://api.harmoniclothing.com/sanctum/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/broadcasting/*"
  to = "https://api.harmoniclothing.com/broadcasting/:splat"
  status = 200
  force = true

# Publicly-served uploads (design files, product mockup photos) live on the
# backend's public disk under /storage/*. storageUrl() in the frontend builds
# these URLs from NEXT_PUBLIC_API_URL, which is this same Netlify domain (see
# the cookie-proxy comment above) — without this rule every product/design
# image 404s since Netlify has no route for /storage/* on its own.
[[redirects]]
  from = "/storage/*"
  to = "https://api.harmoniclothing.com/storage/:splat"
  status = 200
  force = true
